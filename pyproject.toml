# pyproject.toml — single source of truth for this project's packaging,
# dependencies, and tool config. Managed by uv (https://docs.astral.sh/uv/).
# `uv sync` reads this file and writes/updates uv.lock (pinned, reproducible deps).

[project]
name = "compliance-copilot"
version = "0.1.0"
description = "Agentic RAG over EU AI Act + GDPR with eval-gated CI"
requires-python = ">=3.12"
# No runtime dependencies yet — added feature-by-feature (see docs/decisions/).
dependencies = [
    "de-core-news-sm",
    "en-core-web-sm",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-anthropic>=1.6.1",
    "langchain-core>=1.6.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.0",
    "langfuse>=4.14.5,<5",
    "langgraph>=1.2.11",
    "mcp>=1.29.1",
    "pgvector>=0.5.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "selectolax>=0.4.11",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

# Dev-only tools (test runner, linter/formatter, git hook manager).
# uv's special-cased "dev" group installs automatically on `uv sync` / `uv run`.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_copilot"]

# Ruff: linter + formatter (replaces flake8/isort/black). Config docs:
# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = import sorting (isort),
# B = flake8-bugbear (common bug patterns), UP = pyupgrade (modern syntax).
select = ["E", "F", "I", "B", "UP"]

# FastAPI's own `Depends(...)`/`Security(...)` calls as parameter defaults
# are the documented dependency-injection pattern (api.py), not the mutable-
# default-argument bug B008 exists to catch — FastAPI's own docs recommend
# this exact ruff config to stop flagging it.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

# Pytest config. Docs: https://docs.pytest.org/en/stable/reference/reference.html#ini-options-ref
[tool.pytest.ini_options]
testpaths = ["tests"]
# repo root on sys.path for test collection — tests/evals/test_retrieval_
# plumbing.py imports `evals.run_retrieval_eval` (ADR-0013), a top-level
# dir alongside src/, not part of the installed compliance_copilot package.
# Without this, pytest's default "prepend" mode only ever adds each test
# file's own directory, never the repo root, so that import 404s.
pythonpath = ["."]
markers = [
    "integration: hits a real network service (LLM API, DB) — excluded from CI's default run",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
